name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: CLI smoke test
        shell: bash
        env:
          SWITCHBOARD_HOME: ${{ runner.temp }}/sb-home
          SWITCHBOARD_AGENT_HOME: ${{ runner.temp }}/agent-home
        run: |
          node bin/switchboard.js --version
          node bin/switchboard.js start --detach --port 7799
          SWITCHBOARD_URL=http://127.0.0.1:7799 node bin/switchboard.js doctor
          SWITCHBOARD_URL=http://127.0.0.1:7799 node bin/switchboard.js notify "CI says hi"
          SWITCHBOARD_URL=http://127.0.0.1:7799 node bin/switchboard.js stop
      - name: Package contents
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm pack --dry-run
